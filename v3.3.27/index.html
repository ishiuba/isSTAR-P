<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Inicial</title>
    <link
      rel="icon"
      href="./static/img/iamshiuba_web.svg"
      type="image/svg+xml"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"
    />
    <link rel="stylesheet" href="./static/css/output.css" />
  </head>

  <body>
    <i-nav></i-nav>

    <main id="home">
      <section class="hero-section">
        <div class="hero-wrapper">
          <div class="hero-content">
            <h1 data-translate="greeting"></h1>
            <p>
              <span data-translate="mainMsg"></span>
              <br />
              <span data-translate="subMsg"></span>
            </p>
            <div class="hero-buttons">
              <a title="Streaming" href="./streaming.html" class="btn" >
                <i class="fas fa-play"></i>
                <span data-translate="startListening"></span>
              </a>
              <a title="About" href="./about.html" class="btn">
                <i class="fas fa-info-circle"></i>
                <span data-translate="learnMore"></span>
              </a>
            </div>
          </div>
          <div class="floating-image">
            <img
              src="./static/img/iamshiuba_web.svg"
              alt="IamSHIUBA Artist Logo"
              width="500"
              height="500"
              class="hero-image"
            />
          </div>
        </div>
      </section>

      <section id="highlight-section">
        <div id="featured-card">
          <div id="card-header">
            <h2 data-translate="highlight"></h2>
            <p data-translate="hDescription"></p>
          </div>
          <div id="highlightContainer">
            <div class="highlight-loading" style="display: none">
              <div class="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i>
              </div>
              <p>Carregando destaques...</p>
            </div>

            <div class="highlight-error" style="display: none">
              <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
              </div>
              <p id="error-message"></p>
              <button id="retry-highlights" class="retry-btn">
                <i class="fas fa-sync-alt"></i> Tentar novamente
              </button>
            </div>

            <div class="highlight-wrapper" style="display: none">
              <div class="video-container">
                <iframe
                  id="highlight-iframe"
                  src=""
                  title="Featured Playlist"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  referrerpolicy="strict-origin-when-cross-origin"
                  allowfullscreen
                  loading="lazy"
                ></iframe>
              </div>
            </div>
          </div>
          <div class="button-container">
            <button
              aria-label="Check Out YouTube Playlist"
              type="button"
              class="hBtn"
              id="playlist-button"
            >
              <i class="fab fa-youtube"></i>
              <p data-translate="checkOut"></p>
            </button>
          </div>
        </div>
      </section>

      <section id="social-proof">
        <div id="statsContainer">
          <div class="stats-card">
            <i class="fas fa-music"></i>
            <h3
              class="counter"
              data-target="40"
              data-suffix="+"
              data-duration="1500"
              data-translate-key="tracksCreated"
            >
              0
            </h3>
            <p data-translate="tracksCreated"></p>
          </div>
          <div class="stats-card">
            <i class="fas fa-users"></i>
            <h3
              class="counter"
              data-target="300"
              data-suffix="+"
              data-duration="2000"
              data-delay="200"
            >
              0
            </h3>
            <p data-translate="monthlyListeners"></p>
          </div>
          <div class="stats-card">
            <i class="fas fa-star"></i>
            <h3
              class="counter"
              data-target="5.0"
              data-decimals="1"
              data-duration="1800"
              data-delay="400"
            >
              0.0
            </h3>
            <p data-translate="averageRating"></p>
          </div>
        </div>
      </section>
    </main>

    <i-footer></i-footer>

    <i-menu></i-menu>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>

    <script src="./static/js/Components.js"></script>
    <script src="./static/js/Counter.js"></script>
    <script src="./static/js/highlights.js"></script>
    <script src="./static/js/Theme.js"></script>
    <script src="./static/js/Translations.js"></script>
  </body>
  <script src="./static/js/ActiveLinkManager.js"></script>
</html>
